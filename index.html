
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meta de vendas — Comercial</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F6F9; --surface:#FFFFFF; --ink:#13293D; --muted:#5B6B7A;
  --track:#DCE4EC; --done:#1B6E8C; --done-2:#2A9CC0; --gap:#E3A82B; --line:#C9D4DE;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A26; --surface:#15263A; --ink:#E8EEF4; --muted:#9AAABB;
    --track:#223850; --done:#2A9CC0; --done-2:#5CC3E3; --gap:#F0B940; --line:#2C4560;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A26; --surface:#15263A; --ink:#E8EEF4; --muted:#9AAABB;
  --track:#223850; --done:#2A9CC0; --done-2:#5CC3E3; --gap:#F0B940; --line:#2C4560;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;line-height:1.5}
html,body{height:100%}
main{max-width:1600px;min-height:100%;margin:0 auto;padding:clamp(20px,4vw,64px) clamp(16px,4vw,64px);
  display:flex;flex-direction:column;justify-content:center}
@media (min-width:1200px){
  h1{font-size:2.4vw!important}.sub{font-size:1.3vw!important}
  .chart{grid-template-columns:minmax(300px,34vw) 1fr!important}
  .pie{max-width:min(34vw,60vh)!important}
  .pct{font-size:9vw!important}.hero p{font-size:1.5vw!important}
  .legend{font-size:1.2vw}.figures dt{font-size:1.1vw!important}.figures dd{font-size:2vw!important}
}
h1{font-size:clamp(1.1rem,2.4vw,1.35rem);font-weight:600;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 clamp(24px,5vw,40px);font-size:.95rem}

.hero{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 24px;margin-bottom:20px}
.pct{font-size:clamp(4rem,14vw,7.5rem);font-weight:800;line-height:.9;letter-spacing:-.03em;color:var(--done)}
.pct small{font-size:.45em;font-weight:600;margin-left:2px}
.hero p{margin:0 0 .6em;max-width:32ch;color:var(--muted);font-size:1.05rem}
.hero p strong{color:var(--ink)}

.chart{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:clamp(20px,5vw,48px);align-items:center}
@media (max-width:620px){.chart{grid-template-columns:1fr;justify-items:center}}
.pie{width:100%;max-width:340px;height:auto;display:block}
.pie .s-done{fill:var(--done)}
.pie .s-gap{fill:var(--gap)}
.pie path{stroke:var(--bg);stroke-width:3;transform-origin:50% 50%;transform:scale(.6);opacity:0;
  transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .6s}
.pie.on path{transform:scale(1);opacity:1}
.pie text{font-family:inherit;font-weight:700;font-size:13px;fill:#fff}
.legend{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:10px}
.legend b{width:14px;height:14px;border-radius:3px;flex:none}
@media (prefers-reduced-motion:reduce){.pie path{transition:none}}
.figures{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:32px}
.figures div{background:var(--surface);padding:18px 20px}
.figures dt{color:var(--muted);font-size:.9rem;margin-bottom:4px}
.figures dd{margin:0;font-size:clamp(1.3rem,3.2vw,1.6rem);font-weight:600}
.figures .k-done dd{color:var(--done)}
.figures .k-gap dd{color:var(--gap)}

summary{cursor:pointer;width:max-content}
summary:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--done-2);outline-offset:2px}
.edit{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:14px}
.edit label{display:flex;flex-direction:column;gap:4px}
.edit input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);width:170px}
.edit button{font:inherit;font-weight:600;padding:9px 16px;border:0;border-radius:4px;background:var(--done);color:#fff;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>Meta de vendas da equipe comercial</h1>
  <p class="sub" id="updated">Acompanhamento do valor vendido no período</p>

  <section class="chart">
    <svg class="pie" id="pie" viewBox="0 0 200 200" role="img"></svg>
    <div>
      <div class="hero" aria-live="polite">
        <div class="pct" id="pct">0<small>%</small></div>
        <p id="msg">Carregando…</p>
      </div>
      <ul class="legend">
        <li><b style="background:var(--done)"></b>Vendido</li>
        <li><b style="background:var(--gap)"></b>Falta para a meta</li>
      </ul>
    </div>
  </section>

  <dl class="figures">
    <div class="k-done"><dt>Vendido até agora</dt><dd id="v-sold">–</dd></div>
    <div><dt>Meta</dt><dd id="v-goal">–</dd></div>
    <div class="k-gap"><dt>Falta para a meta</dt><dd id="v-gap">–</dd></div>
  </dl>

</main>
<script>
// ===== VALORES DO PAINEL (altere apenas estas 3 linhas) =====
const META     = 200000.00;
const VENDIDO  = 182516.43;
const UPDATED  = "29/09/2026 às 10:47";
// ============================================================
const DEFAULTS = { goal: META, sold: VENDIDO };
const brl = v => v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const brlShort = v => "R$ " + (v/1000).toLocaleString("pt-BR",{maximumFractionDigits:0}) + " mil";
const parse = s => Number(String(s).replace(/[R$\s.]/g,"").replace(",", "."));

let state = {...DEFAULTS};

function render(){
  const {goal, sold} = state;
  const ratio = sold / goal;
  const pct = ratio * 100;
  const shown = Math.min(pct, 100);
  const gap = Math.max(goal - sold, 0);

  document.getElementById("pct").innerHTML =
    pct.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1}) + "<small>%</small>";
  document.getElementById("msg").innerHTML = gap > 0
    ? `da meta atingida. Faltam <strong>${brl(gap)}</strong> para chegar a ${brlShort(goal)}.`
    : `da meta atingida. Meta batida, com <strong>${brl(sold - goal)}</strong> acima do objetivo.`;

  const pie = document.getElementById("pie");
  pie.setAttribute("aria-label", `Gráfico de pizza: ${pct.toFixed(1)}% da meta vendida`);
  const r = 96, c = 100, a = shown/100 * 2*Math.PI;
  const pt = ang => [c + r*Math.sin(ang), c - r*Math.cos(ang)];
  const lbl = (mid, txt) => { const x = c + r*.6*Math.sin(mid), y = c - r*.6*Math.cos(mid);
    return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle">${txt}</text>`; };
  const fmt = v => v.toLocaleString("pt-BR",{maximumFractionDigits:1}) + "%";
  let svg = "";
  if (shown >= 100) {
    svg = `<path class="s-done" d="M${c} ${c-r}A${r} ${r} 0 1 1 ${c-.01} ${c-r}Z"/>` + lbl(Math.PI, "100%");
  } else {
    const [x1,y1] = pt(a);
    svg = `<path class="s-done" d="M${c} ${c}L${c} ${c-r}A${r} ${r} 0 ${a>Math.PI?1:0} 1 ${x1} ${y1}Z"/>`
        + `<path class="s-gap" d="M${c} ${c}L${x1} ${y1}A${r} ${r} 0 ${a>Math.PI?0:1} 1 ${c} ${c-r}Z"/>`
        + lbl(a/2, fmt(shown));
    if (100-shown >= 6) svg += lbl(a + (2*Math.PI-a)/2, fmt(100-shown));
  }
  pie.innerHTML = svg;
  pie.classList.remove("on");
  requestAnimationFrame(() => requestAnimationFrame(() => pie.classList.add("on")));

  document.getElementById("v-sold").textContent = brl(sold);
  document.getElementById("v-goal").textContent = brl(goal);
  document.getElementById("v-gap").textContent = brl(gap);
  document.getElementById("updated").textContent = "Valores atualizados em " + UPDATED;
}

render();
setTimeout(() => location.reload(), 5*60*1000);
</script>
</body>
</html>
