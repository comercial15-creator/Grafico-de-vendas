<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meta de vendas - Comercial</title>
<meta http-equiv="refresh" content="330">
<style>
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: #F3F6F9; color: #13293D;
  font-family: "Segoe UI", Roboto, Arial, Helvetica, sans-serif;
}
.wrap { padding: 3.5vw 5vw; }
h1 { font-size: 2.6vw; font-weight: 600; margin: 0 0 0.4vw 0; }
.sub { color: #5B6B7A; font-size: 1.4vw; margin: 0 0 2.5vw 0; }
.chart { display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
.pie { width: 34vw; height: 34vw; max-width: 60vh; max-height: 60vh;
  -webkit-flex-shrink: 0; flex-shrink: 0; }
.pie svg { width: 100%; height: 100%; display: block; }
.info { margin-left: 5vw; -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }
.pct { font-size: 9vw; font-weight: 800; line-height: 0.9; color: #1B6E8C; letter-spacing: -0.03em; }
.pct small { font-size: 0.45em; font-weight: 600; }
.msg { color: #5B6B7A; font-size: 1.6vw; margin: 1vw 0 1.5vw 0; }
.msg strong { color: #13293D; }
.legend { color: #5B6B7A; font-size: 1.3vw; margin-bottom: 2vw; }
.legend span { display: inline-block; width: 1.1vw; height: 1.1vw; border-radius: 3px;
  vertical-align: middle; margin-right: 0.6vw; }
.legend div { margin-bottom: 0.5vw; }
.card { background: #FFFFFF; border: 1px solid #C9D4DE; border-radius: 6px;
  padding: 1vw 1.4vw; margin-bottom: 0.8vw; overflow: hidden; }
.card .lab { float: left; color: #5B6B7A; font-size: 1.3vw; line-height: 2.6vw; }
.card .val { float: right; font-size: 2.1vw; font-weight: 700; line-height: 2.6vw; }

/* ===== Animação de nova venda ===== */
#nv { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 999;
  background: rgba(6, 16, 26, 0.9); overflow: hidden; text-align: center; }
#nv.on { display: block; -webkit-animation: nvIn 0.5s ease-out; animation: nvIn 0.5s ease-out; }
#nv.off { -webkit-animation: nvOut 1s ease-in forwards; animation: nvOut 1s ease-in forwards; }
#nv .box { position: absolute; top: 50%; left: 0; right: 0; -webkit-transform: translateY(-50%); transform: translateY(-50%); }
#nv .tit { font-size: 8vw; font-weight: 900; color: #F0B940; letter-spacing: -0.02em; line-height: 1;
  text-shadow: 0 0.4vw 2vw rgba(240, 185, 64, 0.45);
  -webkit-animation: nvPulse 1.2s ease-in-out infinite; animation: nvPulse 1.2s ease-in-out infinite; }
#nv .val { font-size: 6vw; font-weight: 800; color: #FFFFFF; margin-top: 2.5vw; }
#nv .tot { font-size: 2vw; color: #9AAABB; margin-top: 1.5vw; }
#nv .tot strong { color: #2A9CC0; }
#nv .cf { position: absolute; top: -5vh; width: 1vw; height: 1.8vw; opacity: 0.9;
  -webkit-animation-name: nvFall; animation-name: nvFall;
  -webkit-animation-timing-function: linear; animation-timing-function: linear;
  -webkit-animation-iteration-count: infinite; animation-iteration-count: infinite; }
@-webkit-keyframes nvIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes nvIn { from { opacity: 0; } to { opacity: 1; } }
@-webkit-keyframes nvOut { from { opacity: 1; } to { opacity: 0; } }
@keyframes nvOut { from { opacity: 1; } to { opacity: 0; } }
@-webkit-keyframes nvPulse { 0%, 100% { -webkit-transform: scale(1); } 50% { -webkit-transform: scale(1.08); } }
@keyframes nvPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
@-webkit-keyframes nvFall { from { -webkit-transform: translateY(0) rotate(0deg); } to { -webkit-transform: translateY(115vh) rotate(720deg); } }
@keyframes nvFall { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(115vh) rotate(720deg); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Meta de vendas da equipe comercial</h1>
  <p class="sub" id="updated">Acompanhamento do valor vendido no período</p>

  <div class="chart">
    <div class="pie" id="pie"></div>
    <div class="info">
      <div class="pct" id="pct">0<small>%</small></div>
      <p class="msg" id="msg">Carregando...</p>
      <div class="legend">
        <div><span style="background:#1B6E8C"></span>Vendido</div>
        <div><span style="background:#E3A82B"></span>Falta para a meta</div>
      </div>
      <div class="card"><span class="lab">Vendido até agora</span><span class="val" id="v-sold" style="color:#1B6E8C">-</span></div>
      <div class="card"><span class="lab">Meta</span><span class="val" id="v-goal">-</span></div>
      <div class="card"><span class="lab">Falta para a meta</span><span class="val" id="v-gap" style="color:#C98A0C">-</span></div>
    </div>
  </div>
</div>


<!-- Tela de comemoração (aparece sozinha quando o valor vendido aumenta) -->
<div id="nv"><div class="box">
  <div class="tit" id="nv-tit">💥 NOVA VENDA! 💥</div>
  <div class="val" id="nv-val"></div>
  <div class="tot" id="nv-tot"></div>
</div></div>

<script>
// ===== VALORES DO PAINEL (altere apenas estas 3 linhas) =====
var META     = 200000.00;
var VENDIDO  = 203598.98;
var UPDATED  = "30/09/2026 às 15:33";
// ============================================================

function brl(v) {
  var neg = v < 0; v = Math.abs(v);
  var parts = v.toFixed(2).split(".");
  var inteiro = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  return (neg ? "-" : "") + "R$ " + inteiro + "," + parts[1];
}
function pctTxt(v) { return v.toFixed(1).replace(".", ","); }
function mil(v) { return "R$ " + Math.round(v / 1000) + " mil"; }

function render() {
  var pct = VENDIDO / META * 100;
  var shown = pct > 100 ? 100 : (pct < 0 ? 0 : pct);
  var gap = META - VENDIDO; if (gap < 0) gap = 0;

  document.getElementById("pct").innerHTML = pctTxt(pct) + "<small>%</small>";
  if (gap > 0) {
    document.getElementById("msg").innerHTML = "da meta atingida. Faltam <strong>" + brl(gap) +
      "</strong> para chegar a " + mil(META) + ".";
  } else {
    document.getElementById("msg").innerHTML = "da meta atingida. Meta batida, com <strong>" +
      brl(VENDIDO - META) + "</strong> acima do objetivo.";
  }
  document.getElementById("updated").innerHTML = "Valores atualizados em " + UPDATED;
  document.getElementById("v-sold").innerHTML = brl(VENDIDO);
  document.getElementById("v-goal").innerHTML = brl(META);
  document.getElementById("v-gap").innerHTML = brl(gap);

  // Gráfico de pizza
  var r = 96, c = 100, a = shown / 100 * 2 * Math.PI;
  function px(ang) { return (c + r * Math.sin(ang)).toFixed(2); }
  function py(ang) { return (c - r * Math.cos(ang)).toFixed(2); }
  function label(mid, txt, size) {
    var x = (c + r * 0.6 * Math.sin(mid)).toFixed(2), y = (c - r * 0.6 * Math.cos(mid) + size * 0.35).toFixed(2);
    return '<text x="' + x + '" y="' + y + '" text-anchor="middle" font-family="Arial, sans-serif" ' +
      'font-weight="bold" font-size="' + size + '" fill="#FFFFFF">' + txt + '</text>';
  }
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">';
  if (shown >= 100) {
    svg += '<circle cx="100" cy="100" r="96" fill="#1B6E8C"/>' + label(Math.PI, "100%", 16);
  } else if (shown <= 0) {
    svg += '<circle cx="100" cy="100" r="96" fill="#E3A82B"/>';
  } else {
    var big = a > Math.PI ? 1 : 0;
    svg += '<path d="M100 100 L100 4 A96 96 0 ' + big + ' 1 ' + px(a) + ' ' + py(a) + ' Z" fill="#1B6E8C" stroke="#F3F6F9" stroke-width="2"/>';
    svg += '<path d="M100 100 L' + px(a) + ' ' + py(a) + ' A96 96 0 ' + (1 - big) + ' 1 100 4 Z" fill="#E3A82B" stroke="#F3F6F9" stroke-width="2"/>';
    svg += label(a / 2, pctTxt(shown) + "%", 16);
    if (100 - shown >= 6) svg += label(a + (2 * Math.PI - a) / 2, pctTxt(100 - shown) + "%", 12);
  }
  svg += '</svg>';
  document.getElementById("pie").innerHTML = svg;
}

render();

// ===== Animação de nova venda =====
// Compara o valor vendido com o da última vez que a página abriu.
// Se aumentou, mostra a comemoração por DURACAO_SEGUNDOS.
// Para testar sem mexer nos valores, abra a página com ?teste no final do endereço.
var DURACAO_SEGUNDOS = 30;
// Uma chave por página, para painéis diferentes no mesmo site do GitHub não se misturarem
var CHAVE = "painel_ultimo_vendido_" + window.location.pathname.replace(/[^a-zA-Z0-9]/g, "_");

function lerAnterior() {
  try { var v = window.localStorage.getItem(CHAVE); if (v !== null && v !== "") return parseFloat(v); } catch (e) {}
  var m = document.cookie.match(new RegExp("(?:^|; )" + CHAVE + "=([^;]*)"));
  return m ? parseFloat(m[1]) : null;
}
function salvarAtual(v) {
  try { window.localStorage.setItem(CHAVE, String(v)); } catch (e) {}
  try { document.cookie = CHAVE + "=" + v + "; max-age=31536000; path=/"; } catch (e) {}
}

function comemorar(diferenca, bateuMeta) {
  var nv = document.getElementById("nv");
  document.getElementById("nv-tit").innerHTML = bateuMeta ? "🏆 META BATIDA! 🏆" : "💥 NOVA VENDA! 💥";
  document.getElementById("nv-val").innerHTML = "+ " + brl(diferenca);
  document.getElementById("nv-tot").innerHTML = "Total vendido: <strong>" + brl(VENDIDO) +
    "</strong> (" + pctTxt(VENDIDO / META * 100) + "% da meta)";

  var cores = ["#F0B940", "#2A9CC0", "#FFFFFF", "#E8664A", "#5FC98B"];
  for (var i = 0; i < 70; i++) {
    var p = document.createElement("div");
    p.className = "cf";
    var dur = (3 + Math.random() * 3).toFixed(2) + "s";
    var atraso = (-Math.random() * 6).toFixed(2) + "s";
    p.style.left = (Math.random() * 100).toFixed(1) + "%";
    p.style.background = cores[i % cores.length];
    p.style.webkitAnimationDuration = dur; p.style.animationDuration = dur;
    p.style.webkitAnimationDelay = atraso; p.style.animationDelay = atraso;
    nv.appendChild(p);
  }

  nv.className = "on";
  setTimeout(function () { nv.className = "on off"; }, (DURACAO_SEGUNDOS - 1) * 1000);
  setTimeout(function () { nv.className = ""; nv.style.display = "none"; }, DURACAO_SEGUNDOS * 1000);
}

(function () {
  var teste = window.location.search.indexOf("teste") !== -1;
  var anterior = lerAnterior();
  if (teste) {
    comemorar(1500, false);
  } else if (anterior !== null && !isNaN(anterior) && VENDIDO > anterior + 0.004) {
    comemorar(VENDIDO - anterior, anterior < META && VENDIDO >= META);
  }
  if (!teste) salvarAtual(VENDIDO);
})();

// Recarrega a cada 5 minutos buscando sempre a versão mais nova
setTimeout(function () {
  window.location.replace(window.location.pathname + "?t=" + new Date().getTime());
}, 5 * 60 * 1000);
</script>
</body>
</html>
